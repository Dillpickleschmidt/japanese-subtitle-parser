[package]
name = "grammar-debug-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "grammar-debug-cli"
path = "src/main.rs"

[dependencies]
grammar-lib = { path = "../grammar-lib" }
kagome-client = { path = "../kagome-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
